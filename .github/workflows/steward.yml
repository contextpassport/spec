name: Steward

# Low-touch upkeep for a specification that does not need daily attention.
# Three jobs, in order of how much the news matters.
#
# 1. Somebody starts using this and nobody notices. Adoption of a CC0 standard
#    is invisible by design: nobody signs up, nobody logs in, and there is no
#    server to count. So .github/adoption-check.mjs looks for evidence that a
#    human did something, chiefly a Context Passport record or a reference SDK
#    import committed to a public repository, and fails the run when a signal
#    rises. GitHub emails the repository owner when a scheduled workflow fails,
#    so the alert costs nothing and needs no secrets or third-party service.
#
#    The baseline in .github/adoption.json is updated by a human, not by this
#    workflow. That means a rise keeps alarming every week until someone
#    acknowledges it by committing the new numbers. For an event this rare and
#    this important, being nagged until you look is the correct behaviour.
#
# 2. Nobody is left waiting. The contributors are the only part of this project
#    that appreciates while it is ignored, and the way to lose them is to let a
#    pull request sit unanswered for a month. Nothing is posted publicly: a bot
#    announcing "3 contributions awaiting reply" on an open standard is worse
#    than silence.
#
#    SDK pull requests land in the other Context Passport repositories, not
#    here. The contribution check therefore scans every repository in the
#    DEFAULT_REPOS list carried by .github/steward-check.mjs and
#    .github/adoption-check.mjs. That list is deliberately not duplicated here:
#    a REPOS value set in this file silently overrides the scripts, and when the
#    two disagree the workflow wins without saying so. REPOS remains supported
#    for running either script by hand against a subset. Those repositories are
#    public; the Actions token is enough for issue, pull request, comment, and
#    review reads. Maintainers are taken from .github/CODEOWNERS in the
#    checkout, which GOVERNANCE.md names as the authoritative list.
#
# 3. The automation does not switch itself off. GitHub disables scheduled
#    workflows after 60 days without repository activity, and any quiet stretch
#    can reach that. A monthly empty commit on a side branch counts as activity
#    and keeps this workflow alive.
#
#    It goes to a side branch rather than main for a concrete reason: main is
#    covered by a ruleset requiring pull requests, so the Actions token cannot
#    push there, and the first version of this workflow failed exactly that way.
#    Pushing elsewhere is also simply better here. A specification's main branch
#    should read as a record of decisions about the format, not as a monthly
#    stream of bot commits.

on:
  schedule:
    - cron: '41 7 * * 1'   # Mondays, 07:41 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

env:
  GRACE_DAYS: '7'
  HEARTBEAT_BRANCH: steward-heartbeat

jobs:
  steward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 1. Adoption, first because it is the news that matters most.
      - name: Watch for external adoption
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/adoption-check.mjs

      # 2. Contributions left without a reply.
      - name: Check for contributions awaiting a reply
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/steward-check.mjs

      # 3. Keep the schedule from being auto-disabled. Runs last and always,
      #    so a genuine alert above cannot stop the automation staying alive.
      - name: Monthly heartbeat
        if: always()
        run: |
          set -euo pipefail
          month=$(date -u +%Y-%m)
          message="chore: steward heartbeat $month"

          git fetch origin "$HEARTBEAT_BRANCH" --quiet 2>/dev/null || true
          last=$(git log -1 --format=%s "origin/$HEARTBEAT_BRANCH" 2>/dev/null || echo '')
          if [ "$last" = "$message" ]; then
            echo "Heartbeat for $month already recorded."
            exit 0
          fi

          git config user.name  'context-passport-steward'
          git config user.email 'actions@github.com'
          git commit --allow-empty -m "$message"
          git push --force origin "HEAD:refs/heads/$HEARTBEAT_BRANCH"
          echo "Heartbeat recorded for $month on $HEARTBEAT_BRANCH."

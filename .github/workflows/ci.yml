name: Spec CI

# Validates the reference examples on every change, and once a week so that
# rot is caught even when nobody is committing.
#
# The examples in this repository are what implementers copy. A wrong hash
# here propagates into downstream implementations as a "correct" reference,
# so the validator recomputes every hash from the payload rather than
# checking that the hashes merely look well-formed.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'   # Mondays, 06:23 UTC
  workflow_dispatch:

jobs:
  examples:
    name: Validate examples against schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: npm install --no-save ajv ajv-formats canonicalize
      - run: node tools/validate-examples.mjs
      # server.js serves contextpassport.com. It previously joined the raw
      # request path onto the site root with no containment check, which made
      # every file the web process could read fetchable over HTTP. Checked here
      # so it cannot come back quietly.
      - run: node tools/check-server.mjs

  scripts:
    name: Automation scripts parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      # Nothing in CI ever loaded .github/*.mjs, so a change that stopped one
      # of them parsing went green three times in a row on #69. The Steward
      # scripts only run on a schedule, where the first sign of trouble is a
      # failure email a week later that reads like the adoption alert it was
      # meant to send.
      #
      # This only proves the files parse. It does not prove they work, and it
      # is not a substitute for running them. It is here because the specific
      # way #69 broke, a `*/` inside a block comment closing it early, is
      # invisible on review and free to catch.
      # Check every file and report all failures, rather than stopping at the
      # first one, so a run names everything that needs fixing.
      - run: |
          failed=0
          for f in .github/*.mjs tools/*.mjs; do
            if node --check "$f"; then
              echo "ok    $f"
            else
              echo "FAIL  $f"
              failed=1
            fi
          done
          exit $failed

  docs-and-examples:
    name: Documented code still runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Offline mode needs no API key and makes no network call, so the
      # integration example is covered by CI like any other code. An example
      # that nobody runs is an example that quietly stops working.
      - run: pip install context-passport
      - run: python examples/integrations/anthropic_sdk.py --offline
      # The quickstart makes specific claims (the chain verifies, editing a
      # record breaks it). Assert those rather than trusting prose nobody has
      # run since it was written.
      - run: python tools/check-quickstart.py
      # Same contract for the TypeScript quickstart: extract its blocks, run
      # them against the published SDK, assert the documented booleans.
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: npm install --no-save @contextpassport/core@^2.0.0 tsx
      - run: node tools/check-quickstart-ts.mjs
